; A harness case that needs no game: a PSP test program (with source code in
; pspautotests/tests/utility/msgdialog/dialog.c) that shows a system message
; dialog. It checks the harness itself and the system-dialog text path.
[case]
game = pspautotests
program = pspautotests/tests/utility/msgdialog/dialog.prx
description = System message dialog with a 59-digit message and the Back prompt
settle_frames = 40
complete = yes

[text.1]
text = 11111111111111111111111111111111111112111111111111111111111

[text.2]
text = Back
